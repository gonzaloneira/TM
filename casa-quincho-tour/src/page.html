<title>Casa Quincho Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed 3D view; one floating control dock along the bottom, room card above it on the left */
:root{
  --bg:#0f1113; --ink:#f4efe6; --ink-dim:#b8b1a4; --panel:rgba(20,22,24,.74); --line:rgba(255,255,255,.16);
  --accent:#d8a657; --accent-ink:#1c1509;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;position:relative}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#snap{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;pointer-events:none;opacity:0}
#brand{position:absolute;top:0;left:0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.55)}
#brand h1{font-family:var(--display);font-weight:600;font-size:clamp(22px,3vw,30px);margin:0;line-height:1;letter-spacing:.01em}
#brand p{margin:5px 0 0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
#hint{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:min(300px,46vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.45;color:var(--ink-dim);backdrop-filter:blur(10px);transition:opacity .5s}
#hint b{color:var(--ink);font-weight:600}
#card{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--dock-h,96px) + 28px);width:min(340px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px 12px 12px 4px;padding:13px 16px 14px;backdrop-filter:blur(12px);opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s;pointer-events:none}
#card.on{opacity:1;transform:none}
#card h2{font-family:var(--display);font-weight:600;font-size:27px;line-height:1.05;margin:0}
#card .sz{margin:6px 0 0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-variant-numeric:tabular-nums}
#card .pt{margin:7px 0 0;font-size:13.5px;line-height:1.45;color:var(--ink)}
#dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
#dock .in{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;backdrop-filter:blur(12px);max-width:100%}
button{font:600 13px var(--body);color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:9px;padding:9px 13px;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s}
button:hover{background:rgba(255,255,255,.15)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{background:#e6b970}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:9px 11px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#15171a}
.time{display:flex;align-items:center;gap:9px;min-width:0}
.time label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-dim)}
.time output{font-weight:700;font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
input[type=range]{width:clamp(120px,18vw,220px);accent-color:var(--accent);min-width:0}
#welcome{position:absolute;inset:0;display:flex;align-items:flex-end;background:linear-gradient(to top,rgba(10,11,12,.9) 0%,rgba(10,11,12,.6) 36%,rgba(10,11,12,0) 72%);padding:0 max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.w-in{max-width:640px;min-width:0;margin-left:clamp(0px,4vw,56px);margin-bottom:clamp(0px,4vh,40px)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
#welcome h1{font-family:var(--display);font-weight:600;font-size:clamp(44px,8vw,84px);line-height:.95;margin:0;text-wrap:balance}
.addr{font-size:16px;margin:14px 0 0}
.price{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,36px);margin:8px 0 0;color:var(--accent);font-variant-numeric:tabular-nums}
.facts{font-size:13px;color:var(--ink-dim);margin:10px 0 0}
.w-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.w-btns button{padding:13px 20px;font-size:15px}
body.intro #dock,body.intro #brand,body.intro #hint,body.intro #joy{display:none}
#contact{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--dock-h,96px) + 28px);width:min(300px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;backdrop-filter:blur(12px);z-index:3}
body.intro #contact{bottom:calc(28px + env(safe-area-inset-bottom,0px))}
#contact .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin:0}
#ctName{font-family:var(--display);font-weight:600;font-size:24px;margin:6px 0 0}
#ctPhone{font-size:18px;font-weight:700;margin:4px 0 0;user-select:all;-webkit-user-select:all;font-variant-numeric:tabular-nums}
#contact .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#contact a{font:600 13px var(--body);color:var(--accent-ink);background:var(--accent);border-radius:9px;padding:9px 13px;text-decoration:none}
#joy{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(var(--dock-h,96px) + 26px);width:124px;height:124px;border-radius:50%;background:rgba(20,22,24,.42);border:1px solid var(--line);touch-action:none;display:grid;place-items:center}
#knob{width:50px;height:50px;border-radius:50%;background:var(--ink);opacity:.85;pointer-events:none}
#bMore{display:none}
#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-size:24px;text-align:center;padding:24px;transition:opacity .6s}
@media (max-width:560px){#hint{top:calc(66px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:none}#card h2{font-size:23px}#dock button{padding:8px 10px}.time label{display:none}#bMore{display:inline-block}#dock .in:not(.open) .seg,#dock .in:not(.open) .time,#dock .in:not(.open) #bMusic{display:none}}
@media (prefers-reduced-motion:reduce){#card,#hint,#load{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="3D walkthrough of the home"></canvas>
<img id="snap" alt="">
<div id="brand"><h1 id="bName"></h1><p id="bAddr"></p></div>
<div id="hint" style="opacity:0"><b>Click the view</b> to look around, <b>W A S D</b> to walk, <b>Shift</b> to go faster, <b>Esc</b> to release the mouse.</div>
<div id="card" role="status" aria-live="polite"><h2 id="cn"></h2><p class="sz" id="cs"></p><p class="pt" id="cp"></p></div>
<div id="dock"><div class="in">
  <button class="primary" id="bTour">Start tour</button>
  <button id="bView">Dollhouse view</button>
  <div class="seg" role="group" aria-label="Interior style">
    <button id="sModern" data-style="modern" aria-pressed="true">Modern</button>
    <button id="sScandi" data-style="scandi" aria-pressed="false">Scandinavian</button>
    <button id="sLux" data-style="lux" aria-pressed="false">Warm luxury</button>
  </div>
  <div class="time"><label for="tod">Time</label><input id="tod" type="range" min="6" max="23" step="0.02" value="10.5"><output id="todOut" for="tod">10:30 AM</output></div>
  <div class="seg" id="levels" role="group" aria-label="Floor level" hidden></div>
  <button id="bMusic" aria-pressed="false">Music off</button>
  <button id="bContact">Contact</button>
  <button id="bMore" aria-expanded="false">Options</button>
</div></div>
<div id="joy" hidden aria-hidden="true"><div id="knob"></div></div>
<div id="welcome"><div class="w-in">
  <p class="eyebrow">3D walkthrough · pre-construction</p>
  <h1 id="wName"></h1>
  <p class="addr" id="wAddr"></p>
  <p class="price" id="wPrice"></p>
  <p class="facts">2 bedrooms · 3 baths · quincho with grill · covered parking for 2</p>
  <div class="w-btns"><button class="primary" id="wStart">Start the tour</button><button id="wFree">Walk around freely</button><button id="wContact">Contact</button></div>
</div></div>
<div id="contact" role="dialog" aria-label="Contact" hidden>
  <p class="lbl">Ask about this home</p><p id="ctName"></p><p id="ctPhone"></p>
  <div class="row"><a id="ctCall">Call</a><button id="ctCopy">Copy number</button><button id="ctClose">Close</button></div>
</div>
<div id="load">Building the house…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){

{const d=INFO.phone.replace(/[^+\d]/g,'');if(d.length>5)$('ctCall').href='tel:'+d;else $('ctCall').hidden=true}

renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));

function blotch(g,s,r,n,al,sz=.25){for(let i=0;i<n;i++){const x=r()*s,y=r()*s,rad=s*(.04+r()*sz),d=r()<.5;const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,d?`rgba(0,0,0,${al})`:`rgba(255,255,255,${al})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;for(const ox of[-s,0,s])for(const oy of[-s,0,s]){g.setTransform(1,0,0,1,ox,oy);g.fillRect(x-rad,y-rad,rad*2,rad*2)}g.setTransform(1,0,0,1,0,0)}}

function tiles(g,s,r,n,grout){const w=s/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++){const v=226+r()*22|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(i*w,j*w,w,w)}blotch(g,s,r,40,.035);g.fillStyle=grout;for(let i=0;i<n;i++){g.fillRect(i*w-1,0,2,s);g.fillRect(0,i*w-1,s,2)}}
function fabricBase(g,s,r,al=.1){for(let y=0;y<s;y+=2){g.fillStyle=`rgba(0,0,0,${al*r()})`;g.fillRect(0,y,s,1)}for(let x=0;x<s;x+=2){g.fillStyle=`rgba(255,255,255,${al*r()})`;g.fillRect(x,0,1,s)}speck(g,s,r,s*14,.1)}
const GEN={
 planks(g,s,r){const rows=16,h=s/rows;for(let i=0;i<rows;i++){let x=-r()*s*.5;while(x<s){const w=s*(.35+r()*.3),v=202+r()*46|0;g.fillStyle=`rgb(${v},${v-3},${v-8})`;g.fillRect(x,i*h,w,h);for(let k=0;k<16;k++){g.fillStyle=`rgba(50,32,14,${.03+r()*.07})`;g.fillRect(x+r()*w*.3,i*h+r()*h,w*(.4+r()*.6),1)}g.fillStyle='rgba(30,18,6,.4)';g.fillRect(x+w-1,i*h,1.5,h);x+=w}g.fillStyle='rgba(30,18,6,.32)';g.fillRect(0,i*h,s,1.3)}},
 herring(g,s,r){const sw=s/8,per=sw/2;for(let st=0;st<8;st++){g.save();g.beginPath();g.rect(st*sw,0,sw,s);g.clip();const dir=st%2?1:-1;for(let k=-4;k<s/per+4;k++){const v=198+((hash('h'+st+'_'+(((k%16)+16)%16))%50))|0;g.fillStyle=`rgb(${v},${v-3},${v-8})`;g.beginPath();const y=k*per;g.moveTo(st*sw,y);g.lineTo(st*sw+sw,y+dir*sw);g.lineTo(st*sw+sw,y+dir*sw+per);g.lineTo(st*sw,y+per);g.closePath();g.fill();g.strokeStyle='rgba(30,18,6,.4)';g.lineWidth=1;g.stroke()}g.restore()}for(let i=0;i<900;i++){g.fillStyle=`rgba(50,32,14,${.04+r()*.06})`;g.fillRect(r()*s,r()*s,6+r()*18,1)}},
 woodgrain(g,s,r){g.fillStyle='#e4e0d8';g.fillRect(0,0,s,s);for(let i=0;i<260;i++){const y=r()*s;g.strokeStyle=`rgba(60,38,16,${.04+r()*.12})`;g.lineWidth=.6+r()*1.4;g.beginPath();g.moveTo(0,y);const a=r()*5,f=1+r()*2;for(let x=0;x<=s;x+=16)g.lineTo(x,y+Math.sin(x/s*PI*2*f)*a);g.stroke()}},
 tileL(g,s,r){tiles(g,s,r,2,'rgba(120,120,120,.55)');veins(g,s,r,5,'#8a8a8a',1.2)},
 tileS(g,s,r){tiles(g,s,r,2,'rgba(110,110,110,.6)')},

 marbleW(g,s,r){g.fillStyle='#f1f0ee';g.fillRect(0,0,s,s);blotch(g,s,r,30,.05);veins(g,s,r,9,'#7d8187',2.4);veins(g,s,r,14,'#a6a9ad',.9)},
 marbleG(g,s,r){g.fillStyle='#f3efe7';g.fillRect(0,0,s,s);blotch(g,s,r,30,.05);veins(g,s,r,8,'#b48a45',2.6);veins(g,s,r,12,'#8f8a80',.9)},
 stone(g,s,r){g.fillStyle='#dcdcda';g.fillRect(0,0,s,s);blotch(g,s,r,60,.06,.12);speck(g,s,r,s*30,.16)},
 fabric(g,s,r){g.fillStyle='#e2e2e2';g.fillRect(0,0,s,s);fabricBase(g,s,r,.14)},
 boucle(g,s,r){g.fillStyle='#dedede';g.fillRect(0,0,s,s);for(let i=0;i<s*9;i++){const x=r()*s,y=r()*s;g.fillStyle=r()<.5?`rgba(255,255,255,${.25+r()*.4})`:`rgba(0,0,0,${.05+r()*.12})`;g.beginPath();g.arc(x,y,1+r()*2.2,0,7);g.fill()}},
 concrete(g,s,r){g.fillStyle='#d9d9d7';g.fillRect(0,0,s,s);blotch(g,s,r,70,.06,.2);speck(g,s,r,s*24,.12)},
 plaster(g,s,r){g.fillStyle='#efefef';g.fillRect(0,0,s,s);blotch(g,s,r,40,.025,.2);speck(g,s,r,s*10,.05)},

 grass(g,s,r){g.fillStyle='#4f7a3a';g.fillRect(0,0,s,s);for(let i=0;i<s*40;i++){const k=r();g.fillStyle=`rgba(${40+k*70|0},${95+k*70|0},${30+k*30|0},.5)`;g.fillRect(r()*s,r()*s,1.5,2+r()*4)}blotch(g,s,r,30,.06)},
 deck(g,s,r){const rows=10,h=s/rows;for(let i=0;i<rows;i++){const v=150+r()*40|0;g.fillStyle=`rgb(${v},${v*.74|0},${v*.5|0})`;g.fillRect(0,i*h,s,h);for(let k=0;k<12;k++){g.fillStyle=`rgba(40,22,8,${.05+r()*.1})`;g.fillRect(r()*s,i*h+r()*h,s*.5,1)}g.fillStyle='rgba(20,10,4,.75)';g.fillRect(0,i*h,s,2.5)}},
 pave(g,s,r){g.fillStyle='#8f8e8a';g.fillRect(0,0,s,s);const n=4,w=s/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++){const v=176+r()*30|0;g.fillStyle=`rgb(${v},${v-2},${v-6})`;g.fillRect(i*w+2,j*w+2,w-4,w-4)}blotch(g,s,r,50,.05,.1);speck(g,s,r,s*20,.12)},
 slat(g,s,r){const n=16,w=s/n;for(let i=0;i<n;i++){const v=205+r()*40|0;g.fillStyle=`rgb(${v},${v-3},${v-8})`;g.fillRect(i*w,0,w,s);for(let k=0;k<10;k++){g.fillStyle=`rgba(60,38,16,${.04+r()*.08})`;g.fillRect(i*w+r()*w,0,1,s)}g.fillStyle='rgba(20,12,4,.8)';g.fillRect(i*w,0,3,s)}},
 asphalt(g,s,r){g.fillStyle='#3d3f42';g.fillRect(0,0,s,s);speck(g,s,r,s*60,.25)},
};

function collide(p){const R=.2;for(let it=0;it<2;it++)for(const c of cols){const nx=clamp(p.x,c[0],c[2]),nz=clamp(p.z,c[1],c[3]),dx=p.x-nx,dz=p.z-nz,d2=dx*dx+dz*dz;if(d2<R*R){if(d2>1e-8){const d=Math.sqrt(d2);p.x=nx+dx/d*R;p.z=nz+dz/d*R}else{const l=p.x-c[0],r=c[2]-p.x,t=p.z-c[1],b=c[3]-p.z,m=Math.min(l,r,t,b);if(m===l)p.x=c[0]-R;else if(m===r)p.x=c[2]+R;else if(m===t)p.z=c[1]-R;else p.z=c[3]+R}}}p.x=clamp(p.x,-6,20);p.z=clamp(p.z,-7.5,27)}
function walkStep(dt){let f=0,s=0;if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyD||keys.ArrowRight)s+=1;if(keys.KeyA||keys.ArrowLeft)s-=1;f-=joy.y;s+=joy.x;if(Math.abs(f)+Math.abs(s)<.05)return;const l=Math.hypot(f,s),v=(keys.ShiftLeft||keys.ShiftRight?4.2:2.1)*dt*Math.min(1,l)/l,sy=Math.sin(yaw),cy=Math.cos(yaw);
 const mx=(-sy*f+cy*s)*v,mz=(-cy*f-sy*s)*v,n=Math.ceil(Math.hypot(mx,mz)/.1);for(let i=0;i<n;i++){pos.x+=mx/n;pos.z+=mz/n;collide(pos)}}

/* ---------- music (generated, no files) ---------- */
let AC=null,master=null,bus=null,nextT=0,chordI=0,musicOn=false,userMuted=false;
const CH=[[130.81,196,246.94,329.63],[110,164.81,261.63,329.63],[87.31,174.61,220,329.63],[98,146.83,246.94,293.66]],PENT=[523.25,587.33,659.25,783.99,880,1046.5];
function note(f,t,dur,type,pk,att,rel){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+att);g.gain.setValueAtTime(pk,t+Math.max(att,dur-rel));g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.05)}
function sched(){if(!AC||AC.state!=='running')return;while(nextT<AC.currentTime+2.5){const c=CH[chordI++%CH.length],t=Math.max(nextT,AC.currentTime+.05);for(const f of c){note(f,t,8.6,'sine',.055,2.4,3.2);note(f*1.004,t,8.6,'triangle',.022,2.8,3.2)}
 const r=rng(chordI*977);for(let i=0;i<4;i++){const tt=t+.6+i*1.7+r()*.8,f=PENT[r()*PENT.length|0];const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.05,tt+.02);g.gain.exponentialRampToValueAtTime(.0005,tt+2.4);o.connect(g);g.connect(bus);o.start(tt);o.stop(tt+2.5)}nextT=t+7}}
function music(on){musicOn=on;if(on){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=0;bus=AC.createGain();const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1700;const dl=AC.createDelay(1);dl.delayTime.value=.43;const fb=AC.createGain();fb.gain.value=.4;bus.connect(lp);lp.connect(master);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(master);master.connect(AC.destination);setInterval(sched,500)}
  AC.resume().then(sched).catch(()=>{});master.gain.setTargetAtTime(.75,AC.currentTime,.6)}else if(AC)master.gain.setTargetAtTime(0,AC.currentTime,.25);
 $('bMusic').textContent=on?'Music on':'Music off';$('bMusic').setAttribute('aria-pressed',on)}

/* ---------- UI ---------- */
$('bTour').onclick=()=>tour?stopTour():(mode==='doll'?(pos.set(PATH[0][0],EYE,PATH[0][1]),startTour()):startTour());
$('bView').onclick=()=>{if(mode==='trans')return;if(tour)stopTour();mode==='doll'?toWalk():toDoll()};

$('wStart').onclick=()=>{userMuted=false;music(true);leaveIntro(()=>startTour())};

$('bContact').onclick=$('wContact').onclick=()=>{$('contact').hidden=!$('contact').hidden};$('ctClose').onclick=()=>$('contact').hidden=true;

if(LEVELS.length>1){const el=$('levels');el.hidden=false;LEVELS.forEach((L,i)=>{const b=document.createElement('button');b.textContent=L.name;b.setAttribute('aria-pressed',i===0);b.onclick=()=>{LEVELS.forEach((q,j)=>{if(q.group)q.group.visible=j<=i;el.children[j].setAttribute('aria-pressed',j===i)});pos.y=EYE+(L.y||0);shadowDirty=true};el.appendChild(b)})}
$('bMore').onclick=()=>{const d=document.querySelector('#dock .in'),o=d.classList.toggle('open');$('bMore').setAttribute('aria-expanded',o);$('bMore').textContent=o?'Hide options':'Options';resize()};
$('tod').oninput=e=>{hourT=+e.target.value};
const snap=$('snap');
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{const k=b.dataset.style;if(k===styleKey)return;renderer.render(scene,camera);try{snap.src=canvas.toDataURL('image/jpeg',.9);snap.style.transition='none';snap.style.opacity=1}catch(_){}
 applyStyle(k);document.querySelectorAll('[data-style]').forEach(x=>x.setAttribute('aria-pressed',x===b));requestAnimationFrame(()=>requestAnimationFrame(()=>{snap.style.transition='opacity .9s ease';snap.style.opacity=0}))});
function resize(){const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?80:68;camera.updateProjectionMatrix();document.documentElement.style.setProperty('--dock-h',$('dock').offsetHeight+'px')}
addEventListener('resize',resize);

/* ---------- loop ---------- */
applyStyle('modern');applyTime(hour);resize();
let last=performance.now(),roofOn=true;
let TS=1;function frame(now){const dt=Math.min(.05,(now-last)/1000)*TS;last=now;
 if(Math.abs(hourT-hour)>.0005){hour=Math.abs(hourT-hour)<.004?hourT:lerp(hour,hourT,1-Math.exp(-dt*7));applyTime(hour)}
 if(mode==='walk')walkStep(dt);else if(mode==='tour'&&tour)tourStep(dt);
 if(mode==='intro'){introT+=dt;const az=.45+.38*Math.sin(introT*.11),d=19;pB.set(7.5+Math.sin(az)*d,4.6,14+Math.cos(az)*d);camera.position.copy(pB);pA.set(7.5,1.8,13);tmpM.lookAt(pB,pA,UP);camera.quaternion.setFromRotationMatrix(tmpM)}
 else if(mode==='walk'||mode==='tour'){camera.position.set(pos.x,pos.y,pos.z);eul.set(pitch,yaw,0);camera.quaternion.setFromEuler(eul)}
 else if(mode==='doll'){dollPose(pB,qB);camera.position.copy(pB);camera.quaternion.copy(qB)}
 else if(mode==='trans'){trans.t+=dt/trans.dur;const k=ease(Math.min(1,trans.t));if(trans.to==='doll')dollPose(pB,qB);else{pB.copy(pos);eul.set(pitch,yaw,0);qB.setFromEuler(eul)}
  camera.position.lerpVectors(pA,pB,k);camera.position.y+=Math.sin(k*PI)*(trans.to==='doll'?2:0);camera.quaternion.slerpQuaternions(qA,qB,k);if(trans.t>=1){mode=trans.to;const a=trans.after;trans=null;if(a)a()}}
 const ro=camera.position.y<2.56||mode==='intro'||!!(trans&&trans.fromIntro);const jv=!(touchy&&mode==='walk');if(joyEl.hidden!==jv)joyEl.hidden=jv;if(ro!==roofOn){roofOn=ro;roofG.visible=ro;shadowDirty=true}
 fireL.intensity=(fireL.userData.b||0)*(.8+.2*Math.sin(now*.013)+.1*Math.sin(now*.031));
 updateEnv(now);if(shadowDirty){renderer.shadowMap.needsUpdate=true;shadowDirty=false}
 renderer.render(scene,camera);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
$('load').style.opacity=0;setTimeout(()=>$('load').hidden=true,700);
window.__tour={cam(x,z,y,p){document.body.classList.remove('intro');$('welcome').hidden=true;pos.set(x,EYE,z);yaw=y||0;pitch=p||0;mode='walk'},time(h){hourT=hour=h;applyTime(h);$('tod').value=h},style:applyStyle,doll(az,pol,dist){if(az!==undefined){doll.az=az;doll.pol=pol;doll.dist=dist}mode='doll'},cols,PATH,startTour,scene,renderer,roofG,set speed(v){TS=v},get mode(){return mode}};
})();
